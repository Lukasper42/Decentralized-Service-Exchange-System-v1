name: SkillX Security Baseline

on:
  push:
    branches:
      - feat/serverless-supabase-runtime
  pull_request:
    branches:
      - master
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: SCA, misconfiguration and secret scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy findings to GitHub code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

      - name: Keep the raw Trivy report
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillx-trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript, actions
          build-mode: none
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:javascript-typescript-and-actions"

  zap-baseline:
    name: Passive DAST (ZAP) against Preview
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - trivy
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Wait for the neutral Preview deployment
        env:
          TARGET_URL: https://skillx-web-six.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$TARGET_URL" || true)"
            if [ "$status" = "200" ]; then
              echo "Preview is responding with HTTP 200."
              exit 0
            fi
            echo "Preview not ready yet (HTTP $status), attempt $attempt/36."
            sleep 10
          done
          echo "Preview did not become ready; stopping before DAST."
          exit 1

      - name: Run passive ZAP Baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://skillx-web-six.vercel.app
          allow_issue_writing: false
          fail_action: false
          artifact_name: skillx-zap-preview-baseline
