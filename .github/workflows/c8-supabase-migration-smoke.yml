name: SkillX Supabase migration smoke tests

on:
  push:
    branches:
      - maintenance/complete-runtime
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - .github/workflows/c8-supabase-migration-smoke.yml
  pull_request:
    paths:
      - supabase/migrations/**
      - supabase/tests/**
      - .github/workflows/c8-supabase-migration-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-smoke:
    name: Rebuild SkillX schemas on disposable PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillx_test
      PGPASSWORD: postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare Supabase-like roles
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO service_role;
          SQL

      - name: Apply all versioned migrations in order
        run: |
          for migration in \
            supabase/migrations/20261113151720_create_skillx_notion_migration_schema.sql \
            supabase/migrations/20261113153017_skillx_notion_archive_schema_v1.sql \
            supabase/migrations/20261114145249_skillx_runtime_initial.sql \
            supabase/migrations/20261114150735_skillx_runtime_remove_seed_import.sql \
            supabase/migrations/20261114163452_mailbox_message_idempotency.sql \
            supabase/migrations/20261114164234_mailbox_idempotent_rpc_name.sql \
            supabase/migrations/20261115110201_skillx_c8_runtime_init.sql
          do
            echo "Applying $migration"
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify C8 runtime
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/c8_runtime_migration_smoke.sql

      - name: Verify archive and mailbox runtime
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/skillx_runtime_migration_smoke.sql
