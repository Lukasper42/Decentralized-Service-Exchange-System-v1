name: Smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: skill-exchange-ledger
      - run: npm ci
        working-directory: skillx-web
      - run: npm install --no-audit --no-fund
        working-directory: skillx-mailbox
      - run: npm run build
      - run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run smoke
