name: CI
on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skill-exchange-ledger
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skill
          POSTGRES_PASSWORD: skill
          POSTGRES_DB: skill_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skill -d skill_exchange_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skill-exchange-ledger/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://skill:skill@localhost:5432/skill_exchange_test
      - name: Coverage
        run: |
          npm run coverage | tee coverage.txt
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skill-exchange-ledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skill-exchange-ledger/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          if [ -f eslint.config.js ]; then
            npx eslint .
          else
            echo "No eslint.config.js found - skipping lint"
          fi
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skillx-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skillx-web/package-lock.json
      - run: npm ci
      - run: npm test
  mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: skillx-mailbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
